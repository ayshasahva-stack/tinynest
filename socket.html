<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TinyNest Admin Socket Test</title>
</head>

<body>

    <h2>TinyNest Admin Socket Test</h2>

    <!-- Socket.IO client library -->
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <script>
        // Use your ADMIN JWT here.
        // Do NOT send your real token to me.
        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2YTk4NDFiMjI3NTU2NTMzZDI2ZWJjN2EiLCJpYXQiOjE3OTAxNzA1ODUsImV4cCI6MTc5MDE3NDE4NX0.GXgWABDEH0BH4BB7frpV0ZgOCk9lLY5V0AfDs0247VU";

        // Connect to TinyNest Socket.IO
        const socket = io("http://localhost:3000", {
            auth: {
                token: token
            }
        });

        // Runs when authentication and connection succeed
        socket.on("connect", () => {
            console.log(
                "Admin Socket.IO connection successful"
            );

            console.log(
                "Socket ID:",
                socket.id
            );
        });

        // Show authentication errors
        socket.on("connect_error", (error) => {
            console.error(
                "Socket authentication failed:",
                error.message
            );
        });

        // Runs when disconnected
        socket.on("disconnect", () => {
            console.log("Socket disconnected");
        });
    </script>

</body>

</html>
